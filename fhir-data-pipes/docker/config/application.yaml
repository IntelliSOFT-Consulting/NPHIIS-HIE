# See `pipelines/controller/config/application.yaml` for full documentation
# of these options.
# This config is meant to be used by `compose-controller-spark-sql.yaml`.
fhirdata:
  # 172.17.0.1 is an example docker network interface ip address;
  # `hapi-server` is another docker example where a container with that name is
  # running on the same docker network.
  fhirFetchMode: "HAPI_JDBC"
  fhirVersion: "R4"
  # fhirServerUrl: "http://172.17.0.1:8091/fhir"
  fhirServerUrl: "https://dsrfhir.intellisoftkenya.com/v2/fhir"
  dbConfig: "config/hapi-postgres-config_local.json"
  dwhRootPrefix: "/dwh/controller_DWH"
  incrementalSchedule: "0 0 */2 * * *"
  purgeSchedule: "0 30 */2 * * *"
  numOfDwhSnapshotsToRetain: 1
  # There is no Questionnaire in our test FHIR server, but it is added to
  # prevent regression of https://github.com/google/fhir-data-pipes/issues/785.
  # TODO: add resource table creation to e2e tests.
  # Task / DiagnosticReport / Specimen: NPHL specimen submission and results;
  # PractitionerRole: user roles; Group: earlier contact groups.
  # Do NOT add List: the pipeline looks up org.hl7.fhir.r4.model.List (HAPI's class is
  # ListResource), so every run fails and Spark stops updating. The dashboards don't need it.
  # A type added here is only complete after a full run (incremental runs fetch changes only).
  resourceList: "Patient,Encounter,Observation,Questionnaire,Condition,Practitioner,PractitionerRole,Location,Organization,Immunization,ServiceRequest,ImmunizationRecommendation,Specimen,Task,DiagnosticReport,Group,MeasureReport,QuestionnaireResponse"
  maxWorkers: 1
  numThreads: 4
  createHiveResourceTables: true
  thriftserverHiveConfig: "config/thriftserver-hive-config_local.json"
  hiveResourceViewsDir: "config/views"
  # Postgres sink (analytics-postgres) for the dashboards: every full and incremental run
  # upserts the flattened views in config/view-definitions (one table per view, named after
  # it; resource types without a view are skipped). Only "Recreate views" drops the tables.
  sinkDbConfigPath: "config/analytics-postgres-config.json"
  viewDefinitionsDir: "config/view-definitions"
# Enable spring boot actuator end points, use "*" to expose all endpoints, or a comma-separated
# list to expose selected ones
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus,pipeline-metrics
