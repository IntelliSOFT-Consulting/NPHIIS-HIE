worker_processes 1;

events {
    worker_connections 1024;
}

http {

    include /etc/nginx/mime.types;

    # Increase buffer sizes to handle large OAuth response headers
    large_client_header_buffers 8 32k;

    # An upstream load balancer (AWS ELB) terminates TLS and sets X-Forwarded-Proto.
    # Fall back to the local scheme when the request reaches nginx directly.
    map $http_x_forwarded_proto $public_scheme {
        default $http_x_forwarded_proto;
        ""      $scheme;
    }

    # Upgrade headers for websockets, harmless for plain requests
    map $http_upgrade $connection_upgrade {
        default upgrade;
        ""      close;
    }

    # Containers are resolved per request so nginx still starts while one is down
    resolver 127.0.0.11 valid=30s;

    server {
        listen 80;
        server_name uat.nphiis.nphl.go.ke;

        client_max_body_size 60M;

        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $public_scheme;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header X-Forwarded-Port 443;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_buffer_size 16k;
        proxy_buffers 8 16k;
        proxy_busy_buffers_size 32k;

        # Admin portal (Next.js). Owns / and its own /api/* routes.
        location / {
            set $upstream_admin nphiis-admin;
            proxy_pass http://$upstream_admin:3000;
        }

        # Keycloak (KC_HTTP_RELATIVE_PATH=/kc)
        location /kc/ {
            set $upstream_keycloak keycloak;
            proxy_pass http://$upstream_keycloak:8080;
        }

        # hie-auth API. The prefix is stripped: /hie-auth/login -> /login
        location /hie-auth/ {
            set $upstream_hie_auth hie-auth;
            rewrite ^/hie-auth/(.*)$ /$1 break;
            proxy_pass http://$upstream_hie_auth:3000;
        }

        # HAPI FHIR (direct)
        location /hapi/ {
            set $upstream_hapi hapi-fhir-jpa;
            rewrite ^/hapi/(.*)$ /$1 break;
            proxy_pass http://$upstream_hapi:8080;
        }

        # Token-checked FHIR R4 gateway in front of HAPI
        location /v2/fhir/ {
            set $upstream_gateway fhir-gateway;
            rewrite ^/v2/fhir/(.*)$ /fhir/$1 break;
            proxy_pass http://$upstream_gateway:8080;
        }
    }
}
