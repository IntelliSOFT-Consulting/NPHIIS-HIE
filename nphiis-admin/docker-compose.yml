services:
  nphiis-admin:
    build:
      context: .
      dockerfile: Dockerfile
    # No host port: serve through the TLS reverse proxy only (see proxy/nginx.conf).
    expose:
      - "3000"
    env_file:
      - .env
    environment:
      - NODE_ENV=production
      - PORT=3000
    volumes:
      # Mount logs if needed
      - ./logs:/app/logs
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://nphiis.nphl.go.ke/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    # Join the same Docker network(s) as hie/docker-compose.yml so the server-side
    # proxy can resolve `hapi-fhir-jpa` when using FHIR_BASE_URL=http://hapi-fhir-jpa:8080/fhir
    # (standalone `docker compose up` previously used only nphiis-network, which isolated admin from HAPI).
    networks:
      - nphiis-network
      - cloudbuild

networks:
  nphiis-network:
    driver: bridge
  cloudbuild:
    external: true

