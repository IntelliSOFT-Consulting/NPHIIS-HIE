# version: "3"
networks:
    openhim:
    hapi-fhir:
    cloudbuild: 
        external: true


services:

    hapi-fhir-postgres:
        container_name: hapi-fhir-postgres
        image: postgres:14-alpine
        restart: always
        networks:
            - hapi-fhir
            - cloudbuild
        environment:
            POSTGRES_USER: postgres
            POSTGRES_DB: hapi
            POSTGRES_PASSWORD: ${HAPI_DB_PASSWORD}
        volumes:
            - 'hapi-fhir-postgres:/var/lib/postgresql/data'

    hapi-fhir-jpa:
        image: hapiproject/hapi:v6.8.0
        container_name: hapi-fhir-jpa
        restart: unless-stopped
        ports:
            - "8787:8080"
        networks:
            - hapi-fhir
            - cloudbuild
        depends_on:
            - hapi-fhir-postgres
        volumes:
            - "./hapi-fhir:/hapi"
        environment:
            SPRING_CONFIG_LOCATION: /hapi/application.yaml
            SPRING_DATASOURCE_PASSWORD: ${HAPI_DB_PASSWORD}
            TZ: Africa/Nairobi
    
    hie-auth:
        container_name: hie-auth
        build: 
            context: ../hie-auth
            dockerfile: Dockerfile
        restart: unless-stopped
        depends_on:
            - nphiis-postgres
        networks:
            - cloudbuild
            - hapi-fhir
            - openhim
        env_file:
            - ../hie-auth/.env
        ports:
            - "8443:3000"
            
    hapi-fhir-config:
        depends_on:
            - hapi-fhir-jpa
        container_name: hapi-fhir-config
        networks:
            - cloudbuild
        build: 
            context: ../hapi-fhir-config
            dockerfile: Dockerfile

    nphiis-postgres:
        container_name: nphiis-postgres
        image: postgres:14-alpine
        restart: always
        networks:
            - hapi-fhir
            - cloudbuild
        environment:
            POSTGRES_USER: postgres
            POSTGRES_DB: nphiis-mediators
            POSTGRES_PASSWORD: ${NPHIIS_DB_PASSWORD}
        # ports:
            # - "5432:5432"
        volumes:
            - 'nphiis-postgres:/var/lib/postgresql/data'

    nphiis-admin:
        container_name: nphiis-admin
        build:
            context: ../nphiis-admin
            dockerfile: Dockerfile
        restart: unless-stopped
        networks:
            - cloudbuild
            - hapi-fhir
        env_file:
            - ../nphiis-admin/.env
        ports:
            - "8080:3000"
        depends_on:
            - hapi-fhir-jpa
            - hie-auth
            - hapi-fhir-config
    fhir-gateway:
        container_name: fhir-gateway
        build:
            context: ../fhir-gateway
            dockerfile: Dockerfile
        restart: unless-stopped
        env_file:
            - ../fhir-gateway/.env
        depends_on:
            - hapi-fhir-jpa
        networks:
            - cloudbuild
            - hapi-fhir
        ports:
            - "8099:8080"

    


volumes:
    hapi-fhir-postgres:
    hapi:
    nphiis-postgres:
